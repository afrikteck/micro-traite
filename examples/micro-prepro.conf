# Genere par micro-traite-gui - ne pas editer a la main
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Micro Traité"
            media.name       = "Micro Traité"
            filter.graph = {
                nodes = [
                    { type = ladspa name = rnnoise plugin = "/usr/lib/ladspa/librnnoise_ladspa.so" label = noise_suppressor_mono
                      control = {
                        "VAD Threshold (%)" = 50.0
                        "VAD Grace Period (ms)" = 100.0
                        "Retroactive VAD Grace (ms)" = 0.0
                      } }
                    { type = builtin name = hp label = bq_highpass control = { "Freq" = 80.0 "Q" = 0.707 } }
                    { type = builtin name = bass label = bq_peaking control = { "Freq" = 110.0 "Q" = 0.7 "Gain" = 3.00 } }
                    { type = builtin name = mud label = bq_peaking control = { "Freq" = 350.0 "Q" = 1.2 "Gain" = -3.00 } }
                    { type = builtin name = pres label = bq_peaking control = { "Freq" = 2500.0 "Q" = 0.7 "Gain" = 2.50 } }
                    { type = ladspa name = comp plugin = "/usr/lib/ladspa/sc4m_1916.so" label = sc4m
                      control = {
                        "RMS/peak" = 0.0
                        "Attack time (ms)" = 8.0
                        "Release time (ms)" = 150.0
                        "Threshold level (dB)" = -18.0
                        "Ratio (1:n)" = 3.0
                        "Knee radius (dB)" = 3.0
                        "Makeup gain (dB)" = 2.0
                      } }
                    { type = ladspa name = limiter plugin = "/usr/lib/ladspa/hard_limiter_1413.so" label = hardLimiter control = { "dB limit" = -1.5 "Wet level" = 1.0 "Residue level" = 0.0 } }
                ]
                links = [
                    { output = "rnnoise:Output" input = "hp:In" }
                    { output = "hp:Out" input = "bass:In" }
                    { output = "bass:Out" input = "mud:In" }
                    { output = "mud:Out" input = "pres:In" }
                    { output = "pres:Out" input = "comp:Input" }
                    { output = "comp:Output" input = "limiter:Input" }
                ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name    = "capture.micro-traite"
                node.target  = "alsa_input.usb-046d_0825_0C936690-02.pro-input-0"
                node.passive = true
            }
            playback.props = {
                node.name    = "micro-traite"
                media.class  = Audio/Source
            }
        }
    }
]
