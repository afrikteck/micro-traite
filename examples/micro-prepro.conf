# Généré par micro-traite-gui - ne pas éditer à la main
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Micro Traité"
            media.name       = "Micro Traité"
            filter.graph = {
                nodes = [
                    { type = ladspa name = rnnoise plugin = "/usr/lib/ladspa/librnnoise_ladspa.so" label = noise_suppressor_mono
                      control = {
                        "VAD Threshold (%)" = 50.0
                        "VAD Grace Period (ms)" = 120.0
                        "Retroactive VAD Grace (ms)" = 0.0
                      } }
                    { type = builtin name = hp label = bq_highpass control = { "Freq" = 55.0 "Q" = 0.707 } }
                    { type = builtin name = corps label = bq_lowshelf control = { "Freq" = 90.0 "Q" = 0.707 "Gain" = 2.00 } }
                    { type = builtin name = box label = bq_peaking control = { "Freq" = 280.0 "Q" = 1.000 "Gain" = -2.50 } }
                    { type = builtin name = mud label = bq_peaking control = { "Freq" = 400.0 "Q" = 1.000 "Gain" = -1.00 } }
                    { type = builtin name = pres label = bq_peaking control = { "Freq" = 2500.0 "Q" = 0.900 "Gain" = 3.50 } }
                    { type = builtin name = intel label = bq_peaking control = { "Freq" = 5000.0 "Q" = 0.900 "Gain" = 2.50 } }
                    { type = builtin name = sib label = bq_peaking control = { "Freq" = 7000.0 "Q" = 2.000 "Gain" = -1.50 } }
                    { type = builtin name = air label = bq_highshelf control = { "Freq" = 12000.0 "Q" = 0.707 "Gain" = 1.50 } }
                    { type = ladspa name = comp1 plugin = "/usr/lib/ladspa/sc4m_1916.so" label = sc4m
                      control = {
                        "RMS/peak" = 1.0
                        "Attack time (ms)" = 20.0
                        "Release time (ms)" = 250.0
                        "Threshold level (dB)" = -22.0
                        "Ratio (1:n)" = 2.0
                        "Knee radius (dB)" = 6.0
                        "Makeup gain (dB)" = 2.0
                      } }
                    { type = ladspa name = comp2 plugin = "/usr/lib/ladspa/sc4m_1916.so" label = sc4m
                      control = {
                        "RMS/peak" = 0.0
                        "Attack time (ms)" = 5.0
                        "Release time (ms)" = 100.0
                        "Threshold level (dB)" = -10.0
                        "Ratio (1:n)" = 4.0
                        "Knee radius (dB)" = 3.0
                        "Makeup gain (dB)" = 4.0
                      } }
                    { type = ladspa name = limiter plugin = "/usr/lib/ladspa/hard_limiter_1413.so" label = hardLimiter control = { "dB limit" = -1.5 "Wet level" = 1.0 "Residue level" = 0.0 } }
                ]
                links = [
                    { output = "rnnoise:Output" input = "hp:In" }
                    { output = "hp:Out" input = "corps:In" }
                    { output = "corps:Out" input = "box:In" }
                    { output = "box:Out" input = "mud:In" }
                    { output = "mud:Out" input = "pres:In" }
                    { output = "pres:Out" input = "intel:In" }
                    { output = "intel:Out" input = "sib:In" }
                    { output = "sib:Out" input = "air:In" }
                    { output = "air:Out" input = "comp1:Input" }
                    { output = "comp1:Output" input = "comp2:Input" }
                    { output = "comp2:Output" input = "limiter:Input" }
                ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name    = "capture.micro-traite"
                node.target  = "alsa_input.usb-046d_0825_0C936690-02.pro-input-0"
                node.passive = true
            }
            playback.props = {
                node.name    = "micro-traite"
                media.class  = Audio/Source
            }
        }
    }
]
